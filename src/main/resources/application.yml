spring:
  application:
    name: lol-scrim

  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:scrim}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
    access-token-ttl-seconds: 1800
  refresh-token-ttl-days: 14
  password-reset-token-ttl-minutes: 15
  password-reset-rate-limit:
    email-limit: 3
    email-window-seconds: 300
    ip-limit: 20
    ip-window-seconds: 3600
  data-dragon:
    base-url: https://ddragon.leagueoflegends.com
    korean-locale: ko_KR
    english-locale: en_US
    sync-on-startup: true
    connect-timeout-millis: 5000
    read-timeout-millis: 10000
  riot:
    api-key: ${RIOT_API_KEY:}
    account-region: asia
    platform: KR
    lane-analysis-match-count: 20
