spring:
  application:
    name: lol-scrim

  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:scrim}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

app:
  jwt:
    # 운영에서는 반드시 환경변수로 주입 (32바이트 이상)
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
    access-token-ttl-seconds: 1800        # 30분
  refresh-token-ttl-days: 14
