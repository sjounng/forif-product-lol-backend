spring:
  application:
    name: lol-scrim

  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:scrim}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

app:
  jwt:
    # 운영에서는 반드시 환경변수로 주입 (32바이트 이상)
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
    access-token-ttl-seconds: 1800        # 30분
  refresh-token-ttl-days: 14
  password-reset-token-ttl-minutes: 15
  password-reset-rate-limit:
    email-limit: 3
    email-window-seconds: 300
    ip-limit: 20
    ip-window-seconds: 3600
  riot:
    # 절대 커밋하지 말 것 — 환경변수 RIOT_API_KEY 로만 주입
    api-key: ${RIOT_API_KEY:}
    account-region: asia   # Account-v1/Match-v5 는 지역 라우팅(americas/asia/europe)
    platform: KR            # Summoner-v4/League-v4 는 플랫폼 라우팅. RiotPlatform enum과 대소문자 맞춤
    # 라인 분포 분석에 쓸 최근 솔랭 판수. 1판당 상세 조회 1회라 그대로 호출 수가 된다(+1).
    # 개발 키(100req/2min)에서는 20 정도가 상한선 — 더 올리면 연속 등록 시 429가 잦아진다.
    lane-analysis-match-count: 20
